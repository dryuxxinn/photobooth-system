services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dryu-booth-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - CAMERA_DRIVER=${CAMERA_DRIVER:-wifi}
      - CAMERA_MODEL=${CAMERA_MODEL:-Sony Alpha a6400 (Wi-Fi)}
      - CAMERA_WIFI_IP=${CAMERA_WIFI_IP:-192.168.122.1}
      - CAMERA_WIFI_PORT=${CAMERA_WIFI_PORT:-10000}
      - CAMERA_WIFI_PROTOCOL=${CAMERA_WIFI_PROTOCOL:-sony_http}
      - PRINTER_DRIVER=${PRINTER_DRIVER:-simulation}
      - PRINTER_NAME=${PRINTER_NAME:-Photo_Printer_Default}
      - STORAGE_BASE_DIR=/app/storage
      - DATABASE_PATH=/app/database/photobooth.db
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./storage:/app/storage
      - ./database:/app/database
      - ./templates:/app/templates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: dryu-booth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
