# Override Docker Compose file for Linux Production (Mini PC / Ubuntu VM)
# Enables direct USB bus access for Canon EOS 700D (gphoto2) and host CUPS socket
# Usage:
#   docker compose -f docker-compose.yml -f deployment/docker/docker-compose.usb.yml up -d --build

services:
  backend:
    privileged: true
    environment:
      - CAMERA_DRIVER=gphoto
      - PRINTER_DRIVER=${PRINTER_DRIVER:-cups}
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /run/cups/cups.sock:/run/cups/cups.sock
